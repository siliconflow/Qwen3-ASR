name: Build and Push Proxy Image

# 构建 Qwen3-ASR proxy sidecar 镜像并推送到 siliconflow 镜像仓库（Core 组织）
# 参考：siliconflow/SenseVoice 与 siliconflow/vllm_agent 的 docker-build.yml
#
# 与 sensevoice 的差异（刻意为之）：
#   - proxy 为架构无关纯 Python 镜像，无 GPU 矩阵、无 torch build-args
#   - tag 格式无 GPU 后缀：{YYYYMMDD}-v{SEMVER}（proxy/VERSION）
#     与本地 proxy/build-image.sh 完全一致，双轨唯一来源
#   - build context 是 proxy/ 子目录
# 本地镜像名注意：build-image.sh 默认推个人 namespace
# (clxuaivn500083i7ncuxpw8cf)；本 CI 推 Core 组织 namespace
# (d1r7umcsfi9c73b4drdg)，部署 yaml 引用 tag 时以 CI 产物为准。
#
# Tag 规则：{YYYYMMDD}-v{VERSION}，VERSION 来自 proxy/VERSION 文件
#   例如：20260914-v1.0.0
#
# 触发方式：
#   - workflow_dispatch：手动触发（Review 通过后使用）
#   - push 到 feat/sf-gpu-function-adaptation：该分支为事实上的主分支
#   - pull_request：仅验证 Dockerfile 可构建，不 push

on:
  push:
    branches: [feat/sf-gpu-function-adaptation]
  pull_request:
    branches: [feat/sf-gpu-function-adaptation]
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制构建（跳过 tag 存在性检查）'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: hub.6scloud.com
  NAMESPACE: d1r7umcsfi9c73b4drdg
  IMAGE_NAME: qwen3-asr-proxy

jobs:
  build-and-push:
    name: Build proxy image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < proxy/VERSION)
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: proxy/VERSION file is empty"
            exit 1
          fi
          DATE_TAG=$(date -u +%Y%m%d)
          FULL_TAG="${DATE_TAG}-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "full_tag=$FULL_TAG" >> "$GITHUB_OUTPUT"
          echo "========================================"
          echo "Version : $VERSION"
          echo "Tag     : $FULL_TAG"
          echo "Registry: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}"
          echo "========================================"

      - name: Login to registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SILICONFLOW_REGISTRY_USERNAME }}
          password: ${{ secrets.SILICONFLOW_REGISTRY_PASSWORD }}

      - name: Check if image already exists
        id: check_existing
        if: ${{ github.event_name != 'pull_request' && github.event.inputs.force_build != 'true' }}
        run: |
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full_tag }}"
          echo "Checking existing image: $FULL_IMAGE"
          # 用 docker manifest inspect 检查 registry 中是否已有该 tag
          # （ubuntu-latest 预装 docker 但不预装 skopeo）
          if docker manifest inspect "$FULL_IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Image already exists: $FULL_IMAGE. Skip building. (Use force_build=true to override)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag is unique, proceeding with build."
          fi

      - name: Set up Docker Buildx
        if: ${{ steps.check_existing.outputs.exists != 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        if: ${{ steps.check_existing.outputs.exists != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          file: ./proxy/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full_tag }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy

      - name: Print image info
        if: ${{ steps.check_existing.outputs.exists != 'true' && github.event_name != 'pull_request' }}
        run: |
          echo "========================================"
          echo "Build completed successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full_tag }}"
          echo "========================================"

      - name: Skip notice
        if: ${{ steps.check_existing.outputs.exists == 'true' }}
        run: |
          echo "Image already exists, skipped build."
          echo "Image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full_tag }}"
